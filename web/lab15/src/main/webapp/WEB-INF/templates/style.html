<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="styles">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--ink:#18231f;--muted:#718078;--green:#245b45;--lime:#d7ef9c;--paper:#f5f7f1;--line:#e2e9df;--white:#fff;--orange:#e89b5b}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,Segoe UI,Arial,sans-serif}main{max-width:1120px;margin:0 auto;padding:28px 28px 64px}.topline{display:flex;justify-content:space-between;align-items:center;padding:22px max(28px,calc((100vw - 1120px)/2));background:#fff}.brand{font-weight:900;letter-spacing:.08em;color:var(--green);text-decoration:none;font-size:19px}.brand span{color:var(--orange);margin-left:4px}.tag,.eyebrow,.session-label{font-size:10px;letter-spacing:.17em;font-weight:800;color:var(--muted)}.hero{background:var(--green);color:white;padding:38px max(28px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:center;gap:28px}.eyebrow{color:var(--lime);margin:0 0 8px}.hero h1{font-size:clamp(32px,5vw,48px);line-height:1.05;margin:0;font-weight:800;letter-spacing:-.04em}.subtitle{color:#d7e6dc;margin:12px 0 0}.session-card{min-width:235px;padding:17px 20px;background:#ffffff16;border:1px solid #ffffff35;border-radius:14px;display:grid;gap:3px}.session-label{color:var(--lime)}.session-card strong{font-size:32px;line-height:1.2}.session-card small{font-size:11px;color:#e0ebe4}nav{display:flex;gap:8px;flex-wrap:wrap;padding:13px max(28px,calc((100vw - 1120px)/2));background:#fff;border-bottom:1px solid var(--line)}nav a{padding:8px 13px;color:var(--green);text-decoration:none;font-weight:650;border-radius:8px}nav a:hover{background:#eef4e8}.page-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:6px 0 22px}.page-head h2{font-size:25px;margin:0;letter-spacing:-.03em}.muted{color:var(--muted)}.panel,.stat,.table-wrap{background:#fff;border:1px solid var(--line);border-radius:15px;padding:22px;margin:16px 0;box-shadow:0 5px 18px #203b2910}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.stat span{color:var(--muted);font-size:12px;font-weight:700}.stat strong{display:block;font-size:34px;color:var(--green);margin-top:5px}.table-wrap{overflow-x:auto;padding:0}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;padding:14px 17px;border-bottom:1px solid var(--line)}th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);background:#fafbf8}tr:last-child td{border-bottom:0}.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#edf5e5;color:#416c43;font-size:11px;font-weight:750}.pill.done{background:#e8eefb;color:#49608f}.button,button{border:0;border-radius:9px;background:var(--green);color:#fff;padding:10px 15px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}.button:hover,button:hover{background:#347557}.secondary{background:#eef4e8;color:var(--green)}.secondary:hover{background:#e1ecd8}.filters,.form-grid{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.field{display:grid;gap:5px;flex:1;min-width:145px}.field label{font-size:12px;font-weight:700;color:var(--muted)}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #d7e0d5;border-radius:8px;background:#fff;font:inherit;color:var(--ink)}textarea{min-height:75px;resize:vertical}.message{padding:12px 15px;border-radius:9px;background:#f0f6df;color:#49652d;margin:14px 0}.empty{padding:28px;text-align:center;color:var(--muted)}.footer{margin-top:35px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}.split{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}.form-panel h3,.panel h3{margin:0 0 14px;font-size:17px}.actions{display:flex;gap:8px;align-items:center}.inline-form{display:flex;gap:7px;min-width:250px}.inline-form input{min-width:110px}.error{border-left:4px solid #c65f48}
@media(max-width:700px){.hero{align-items:flex-start;flex-direction:column}.session-card{width:100%}.split{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}main{padding:22px 16px 45px}.topline,nav{padding-left:16px;padding-right:16px}}
</style>
</head><body></body></html>
