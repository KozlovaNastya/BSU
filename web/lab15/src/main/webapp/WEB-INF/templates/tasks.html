<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{style :: styles}"><title>Tasks</title></head><body>
<div th:replace="~{fragments :: header('Keeper tasks', 'Assign work and record its completion')}"></div>
<main><div class="page-head"><div><h2>Task management</h2><p class="muted">Choose a keeper to see their assignments.</p></div></div>
<div th:if="${message != null}" class="message" th:text="${message}">Message</div>
<div class="panel"><form class="filters" method="get" th:action="@{/tasks}"><div class="field"><label for="keeperId">Keeper</label><select id="keeperId" name="keeperId"><option th:each="keeper : ${keepers}" th:value="${keeper.id}" th:text="${keeper.name}" th:selected="${keeper.id == selectedKeeperId}">Keeper</option></select></div><div class="field"><label for="status">Status</label><select id="status" name="status"><option value="" th:selected="${selectedStatus == ''}">All tasks</option><option value="assigned" th:selected="${selectedStatus == 'assigned'}">Assigned</option><option value="completed" th:selected="${selectedStatus == 'completed'}">Completed</option></select></div><button type="submit">Show tasks</button></form></div>
<div class="split"><section><div class="table-wrap"><table><thead><tr><th>Task</th><th>Animal / care</th><th>Status</th><th>Date</th></tr></thead><tbody><tr th:each="task : ${tasks}"><td><strong th:text="${task.description}">Task description</strong><div class="muted" th:if="${task.result != null}" th:text="${'Result: ' + task.result}">Result</div><div th:if="${task.status != 'completed'}" style="margin-top:8px"><form class="inline-form" method="post" th:action="@{/tasks/complete}"><input type="hidden" name="taskId" th:value="${task.id}"><input type="hidden" name="keeperId" th:value="${selectedKeeperId}"><input name="result" placeholder="Completion result" required><button type="submit">Done</button></form></div></td><td><span th:text="${task.animal != null ? task.animal.name : '—'}">Animal</span><div class="muted" th:text="${task.care != null ? task.care.description : '—'}">Care</div></td><td><span class="pill" th:classappend="${task.status == 'completed' ? ' done' : ''}" th:text="${task.status}">assigned</span></td><td th:text="${task.dateAssigned}">2026-11-10</td></tr><tr th:if="${#lists.isEmpty(tasks)}"><td colspan="4" class="empty">No tasks for this keeper and filter.</td></tr></tbody></table></div></section>
<section class="panel form-panel"><h3>Assign a new task</h3><form method="post" th:action="@{/tasks/assign}"><div class="field"><label>Keeper</label><select name="keeperId" required><option th:each="keeper : ${keepers}" th:value="${keeper.id}" th:text="${keeper.name}">Keeper</option></select></div><div class="field" style="margin-top:12px"><label>Animal</label><select name="animalId" required><option th:each="animal : ${animals}" th:value="${animal.id}" th:text="${animal.name + ' · ' + animal.kind}">Animal</option></select></div><div class="field" style="margin-top:12px"><label>Care activity</label><select name="careId" required><option th:each="care : ${cares}" th:value="${care.id}" th:text="${care.description}">Care</option></select></div><div class="field" style="margin-top:12px"><label>Description</label><textarea name="description" placeholder="Describe what should be done" required></textarea></div><button style="margin-top:14px" type="submit">Assign task</button></form></section></div>
<div class="footer"><span>Task operations are handled by TaskDao.</span><span>Session ID: <span th:text="${sessionId}">—</span></span></div></main></body></html>
