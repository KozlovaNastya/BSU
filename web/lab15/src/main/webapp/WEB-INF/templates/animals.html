<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{style :: styles}"><title>Animals</title></head><body>
<div th:replace="~{fragments :: header('Animal collection', 'Meet the residents and filter the list by species or age')}"></div>
<main><div class="page-head"><div><h2>Animals</h2><p class="muted">The zoo residents stored in the database.</p></div></div>
<div th:if="${message != null}" class="message" th:text="${message}">Message</div>
<div class="panel"><form class="filters" method="get" th:action="@{/animals}"><div class="field"><label for="kind">Species</label><input id="kind" name="kind" placeholder="e.g. Панда" th:value="${kind}"></div><div class="field"><label for="minAge">Minimum age</label><input id="minAge" name="minAge" type="number" min="0" th:value="${minAge}"></div><div class="field"><label for="maxAge">Maximum age</label><input id="maxAge" name="maxAge" type="number" min="0" th:value="${maxAge}"></div><button type="submit">Apply filters</button><a class="button secondary" th:href="@{/animals}">Reset</a></form></div>
<div class="table-wrap"><table><thead><tr><th>#</th><th>Name</th><th>Species</th><th>Age</th><th>Weight (kg)</th></tr></thead><tbody><tr th:each="animal : ${animals}"><td th:text="${animal.id}">1</td><td><strong th:text="${animal.name}">Бу</strong></td><td><span class="pill" th:text="${animal.kind}">Panda</span></td><td th:text="${animal.age}">3</td><td th:text="${#numbers.formatDecimal(animal.weight,1,1)}">12.5</td></tr><tr th:if="${#lists.isEmpty(animals)}"><td colspan="5" class="empty">No animals match the selected filters.</td></tr></tbody></table></div>
<section class="panel form-panel"><h3>Add an animal</h3><form class="form-grid" method="post" th:action="@{/animals/create}"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Species</label><input name="kind" required></div><div class="field"><label>Age</label><input name="age" type="number" min="0" required></div><div class="field"><label>Weight (kg)</label><input name="weight" type="number" min="0.1" step="0.1" required></div><button type="submit">Add animal</button></form></section>
<div class="footer"><span>Animal records are loaded through AnimalDao.</span><span th:text="${#lists.size(animals)} + ' records'">0 records</span></div></main></body></html>
