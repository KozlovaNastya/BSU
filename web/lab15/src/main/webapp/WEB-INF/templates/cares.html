<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{style :: styles}"><title>Care activities</title></head><body>
<div th:replace="~{fragments :: header('Care activities', 'Daily routines that keep every animal healthy')}"></div>
<main><div class="page-head"><div><h2>Care directory</h2><p class="muted">Care activities and the animals they belong to.</p></div></div>
<div th:if="${message != null}" class="message" th:text="${message}">Message</div>
<div class="table-wrap"><table><thead><tr><th>#</th><th>Activity</th><th>Type</th><th>Animal</th></tr></thead><tbody><tr th:each="care : ${cares}"><td th:text="${care.id}">1</td><td><strong th:text="${care.description}">Feeding</strong></td><td><span class="pill" th:text="${care.type}">Nutrition</span></td><td th:text="${care.animal != null ? care.animal.name : '—'}">Бу</td></tr><tr th:if="${#lists.isEmpty(cares)}"><td colspan="4" class="empty">No care activities found.</td></tr></tbody></table></div>
<section class="panel form-panel"><h3>Add a care activity</h3><form class="form-grid" method="post" th:action="@{/cares/create}"><div class="field"><label>Animal</label><select name="animalId" required><option th:each="animal : ${animals}" th:value="${animal.id}" th:text="${animal.name + ' · ' + animal.kind}">Animal</option></select></div><div class="field"><label>Activity type</label><input name="type" placeholder="Nutrition, treatment..." required></div><div class="field"><label>Description</label><input name="description" required></div><button type="submit">Add activity</button></form></section>
<div class="footer"><span>Care records are loaded through CareDao.</span><span th:text="${#lists.size(cares)} + ' records'">0 records</span></div></main></body></html>
