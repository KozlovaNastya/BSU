<h3>{{ isEditMode ? 'Редактирование животного' : 'Новое животное' }}</h3>

<form #animalForm="ngForm" (ngSubmit)="save()" class="mt-3">
  <div class="mb-3">
    <label for="animalkind" class="form-label">Вид животного</label>
    <input
      type="text"
      class="form-control"
      id="animalkind"
      name="animalkind"
      [(ngModel)]="animal.animalkind"
      required
      #animalkindInput="ngModel"
    />
    <div *ngIf="animalkindInput.invalid && animalkindInput.touched" class="text-danger">
      Введите вид животного
    </div>
  </div>

  <div class="mb-3">
    <label for="nikname" class="form-label">Кличка</label>
    <input
      type="text"
      class="form-control"
      id="nikname"
      name="nikname"
      [(ngModel)]="animal.nikname"
      required
      #niknameInput="ngModel"
    />
    <div *ngIf="niknameInput.invalid && niknameInput.touched" class="text-danger">
      Введите кличку
    </div>
  </div>

  <div class="mb-3">
    <label for="age" class="form-label">Возраст</label>
    <input
      type="text"
      class="form-control"
      id="age"
      name="age"
      [(ngModel)]="animal.age"
      required
    />
  </div>

  <div class="mb-3">
    <label for="weight" class="form-label">Вес</label>
    <input
      type="text"
      class="form-control"
      id="weight"
      name="weight"
      [(ngModel)]="animal.weight"
      required
    />
  </div>

  <button
    type="submit"
    class="btn btn-primary me-2"
    [disabled]="animalForm.invalid"
  >
    {{ isEditMode ? 'Сохранить' : 'Добавить' }}
  </button>

  <button
    *ngIf="isEditMode"
    type="button"
    class="btn btn-danger me-2"
    (click)="delete()"
  >
    Удалить
  </button>

  <button type="button" class="btn btn-secondary" (click)="cancel()">
    Отмена
  </button>
</form>
