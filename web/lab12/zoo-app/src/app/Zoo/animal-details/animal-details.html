<div *ngIf="animal; else notFound">
  <h3>Детали животного</h3>
  <ul class="list-group">
    <li class="list-group-item"><strong>ID:</strong> {{ animal.id }}</li>
    <li class="list-group-item"><strong>Вид:</strong> {{ animal.animalkind }}</li>
    <li class="list-group-item"><strong>Кличка:</strong> {{ animal.nikname }}</li>
    <li class="list-group-item"><strong>Возраст:</strong> {{ animal.age }}</li>
    <li class="list-group-item"><strong>Вес:</strong> {{ animal.weight }}</li>
  </ul>
  <div class="mt-3">
    <!--<a [routerLink]="['/zoo/edit', animal.id]" class="btn btn-warning me-2">Редактировать</a>-->
    <a routerLink="/zoo" class="btn btn-secondary">Назад к списку</a>
  </div>
</div>

<ng-template #notFound>
  <p class="text-danger">Животное не найдено</p>
  <a routerLink="/zoo" class="btn btn-secondary">Назад к списку</a>
</ng-template>
